# Activar soporte del ratón
set -g mouse on

# Mejorar la representación de colores
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aumentar el historial
set -g history-limit 50000

# Empezar la numeración desde 1
set -g base-index 1
setw -g pane-base-index 1

# Atajos para dividir paneles
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Recargar configuración
bind r source-file ~/.tmux.conf

# Colores de los paneles
set -g pane-border-style fg="#45475a"
set -g pane-active-border-style fg="#89b4fa"

# Barra de estado
set -g status-style bg="#181825",fg="#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-right "#[fg=#a6e3a1] %d/%m/%Y #[fg=#89b4fa] %H:%M "
set -g window-status-current-style fg="#89b4fa",bold

# Reducir retardo de Escape
set -sg escape-time 0

# VS Code Dark+ theme
set -g pane-border-style fg="#3C3C3C"
set -g pane-active-border-style fg="#569CD6"

set -g status-style bg="#252526",fg="#D4D4D4"

set -g status-left "#[fg=#569CD6,bold] #S "
set -g status-right "#[fg=#4EC9B0] %d/%m/%Y #[fg=#569CD6] %H:%M "

set -g window-status-current-style fg="#569CD6",bold
